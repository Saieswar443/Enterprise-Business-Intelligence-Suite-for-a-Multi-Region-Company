name: DA-01 refresh-warehouse
# Scheduled data movement (the "scheduled jobs" alternative to Azure Data Factory):
# nightly: download source -> ETL -> tests -> commit refreshed CSVs that Power BI Service reads.
on:
  schedule: [{cron: "0 2 * * *"}]      # 02:00 UTC daily; Power BI scheduled refresh should run after this (e.g. 03:00 UTC)
  workflow_dispatch: {}
  push:
    paths: ["DA-01/etl/**", "DA-01/sql/**", "DA-01/tests/**", "DA-01/config/**"]
permissions:
  contents: write
defaults:
  run:
    working-directory: DA-01
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: DA-01/requirements.txt}
      - run: pip install -r requirements.txt
      - run: bash scripts/download_data.sh
      - name: Build warehouse
        run: python etl/build_warehouse.py
      - name: Quality gate (fails the run - and blocks the commit - if any test fails)
        run: python -m pytest tests -q
      - name: Commit refreshed CSVs
        run: |
          git config user.name  "bi-suite-bot"
          git config user.email "bi-suite-bot@users.noreply.github.com"
          git add data/warehouse/*.csv
          git diff --cached --quiet || git commit -m "chore(data): scheduled warehouse refresh [skip ci]"
          git push
